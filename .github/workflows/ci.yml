name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Generated code matches the committed schema
        run: |
          go tool genqlient
          git diff --exit-code
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean
