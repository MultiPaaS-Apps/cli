query Me {
  me {
    id
    email
    # @genqlient(pointer: true)
    name
  }
}

query MyTenants {
  myTenants {
    client {
      id
      name
    }
    applicationId
    appTenantId
  }
}

query Applications($page: PageInput!) {
  applications(page: $page) {
    items {
      id
      name
    }
    pageInfo {
      hasMore
    }
  }
}

query AppTenants($page: PageInput!) {
  appTenants(page: $page) {
    items {
      id
      name
    }
    pageInfo {
      hasMore
    }
  }
}

mutation CreateAppTenant($input: CreateAppTenantInput!) {
  createAppTenant(input: $input) {
    id
    name
  }
}

query ScopedAppTenant {
  me {
    application {
      id
      name
    }
    appTenant {
      id
      name
    }
  }
}

fragment EntityParts on Entity {
  id
  name
  graphqlTypeName
  graphqlPluralName
  managed
}

fragment FieldParts on Field {
  id
  entity {
    id
  }
  # @genqlient(pointer: true)
  name
  graphqlFieldName
  type
  required
  enumValues
  # @genqlient(pointer: true)
  enumType {
    id
    name
  }
  isLifecycle
  isParent
  # @genqlient(pointer: true)
  referencesEntity {
    id
  }
  # @genqlient(pointer: true)
  relatedField {
    id
  }
}

fragment EnumTypeParts on EnumType {
  id
  name
  graphqlTypeName
  values {
    value
    graphqlName
  }
}

fragment ConstraintParts on Constraint {
  id
  entity {
    id
  }
  kind
  fields(page: {page: 0, pageSize: 100}) {
    items {
      id
    }
  }
}

query Entities($page: PageInput!) {
  entities(page: $page) {
    items {
      ...EntityParts
    }
    pageInfo {
      hasMore
    }
  }
}

query EnumTypes($page: PageInput!) {
  enumTypes(page: $page) {
    items {
      ...EnumTypeParts
    }
    pageInfo {
      hasMore
    }
  }
}

query Fields($entityId: ID!, $page: PageInput!) {
  fields(entityId: $entityId, page: $page) {
    items {
      ...FieldParts
    }
    pageInfo {
      hasMore
    }
  }
}

query Constraints($entityId: ID!, $page: PageInput!) {
  constraints(entityId: $entityId, page: $page) {
    items {
      ...ConstraintParts
    }
    pageInfo {
      hasMore
    }
  }
}

query LatestModelRevision {
  modelRevisions(page: {page: 0, pageSize: 1}) {
    items {
      id
    }
  }
}

mutation CreateEntity($input: CreateEntityInput!) {
  createEntity(input: $input) {
    ...EntityParts
  }
}

mutation UpdateEntity($input: UpdateEntityInput!) {
  updateEntity(input: $input) {
    ...EntityParts
  }
}

mutation RetireEntity($entityId: ID!) {
  retireEntity(entityId: $entityId) {
    ...EntityParts
  }
}

mutation CreateEnumType($input: CreateEnumTypeInput!) {
  createEnumType(input: $input) {
    ...EnumTypeParts
  }
}

mutation UpdateEnumType($input: UpdateEnumTypeInput!) {
  updateEnumType(input: $input) {
    ...EnumTypeParts
  }
}

mutation RetireEnumType($enumTypeId: ID!) {
  retireEnumType(enumTypeId: $enumTypeId) {
    ...EnumTypeParts
  }
}

mutation CreateField($input: CreateFieldInput!) {
  createField(input: $input) {
    ...FieldParts
  }
}

mutation UpdateField($input: UpdateFieldInput!) {
  updateField(input: $input) {
    ...FieldParts
  }
}

mutation RetireField($fieldId: ID!) {
  retireField(fieldId: $fieldId) {
    ...FieldParts
  }
}

mutation CreateConstraint($input: CreateConstraintInput!) {
  createConstraint(input: $input) {
    ...ConstraintParts
  }
}

mutation RetireConstraint($constraintId: ID!) {
  retireConstraint(constraintId: $constraintId) {
    ...ConstraintParts
  }
}

query ModelRevisions($page: PageInput!) {
  modelRevisions(page: $page) {
    items {
      id
      createdAt
    }
    pageInfo {
      hasMore
    }
  }
}

query ApiSchema($revisionId: ID!) {
  apiSchema(revisionId: $revisionId)
}

query ApiSchemaDiff($fromRevisionId: ID!, $toRevisionId: ID!) {
  # @genqlient(typename: "versionDiff")
  apiSchemaDiff(fromRevisionId: $fromRevisionId, toRevisionId: $toRevisionId) {
    # @genqlient(typename: "schemaChange")
    breaking {
      type
      description
    }
    # @genqlient(typename: "schemaChange")
    dangerous {
      type
      description
    }
    # @genqlient(typename: "schemaChange")
    added {
      type
      description
    }
  }
}

fragment RecordParts on Record {
  id
  data
  createdAt
  updatedAt
}

query Record($entityId: ID!, $id: ID!) {
  # @genqlient(pointer: true)
  record(entityId: $entityId, id: $id) {
    ...RecordParts
  }
}

query Records(
  $entityId: ID!
  $page: PageInput!
  # @genqlient(pointer: true)
  $reference: RecordReferenceInput
) {
  records(entityId: $entityId, page: $page, reference: $reference) {
    items {
      ...RecordParts
    }
    pageInfo {
      hasMore
    }
  }
}

mutation CreateRecord($input: CreateRecordInput!) {
  createRecord(input: $input) {
    ...RecordParts
  }
}

mutation UpdateRecord($input: UpdateRecordInput!) {
  updateRecord(input: $input) {
    ...RecordParts
  }
}

mutation RetireRecord($input: RetireRecordInput!) {
  retireRecord(input: $input) {
    ...RecordParts
  }
}

fragment OAuthClientParts on OAuthClient {
  id
  name
  redirectUris
  createdAt
}

query OAuthClients {
  oauthClients {
    ...OAuthClientParts
  }
}

mutation CreateOAuthClient($input: CreateOAuthClientInput!) {
  createOAuthClient(input: $input) {
    ...OAuthClientParts
  }
}

mutation UpdateOAuthClient($input: UpdateOAuthClientInput!) {
  updateOAuthClient(input: $input) {
    ...OAuthClientParts
  }
}

fragment DataImportParts on DataImport {
  id
  status
  problemCount
  # @genqlient(pointer: true)
  problemReportUrl
  problems {
    file
    # @genqlient(pointer: true)
    line
    # @genqlient(pointer: true)
    sourceId
    # @genqlient(pointer: true)
    field
    code
    message
  }
  counts {
    key
    count
  }
  files {
    ...DataImportFileParts
  }
  # @genqlient(pointer: true)
  startedAt
  # @genqlient(pointer: true)
  finishedAt
}

fragment DataImportFileParts on DataImportFile {
  id
  kind
  # @genqlient(pointer: true)
  entity {
    id
    name
  }
  file {
    id
    filename
    sizeBytes
    status
  }
}

mutation CreateDataImport($applicationId: ID!) {
  createDataImport(applicationId: $applicationId) {
    ...DataImportParts
  }
}

mutation AddDataImportFile($input: AddDataImportFileInput!) {
  addDataImportFile(input: $input) {
    importFile {
      ...DataImportFileParts
    }
    uploadUrl
    uploadHeaders {
      name
      value
    }
  }
}

mutation RemoveDataImportFile($importId: ID!, $fileId: ID!) {
  removeDataImportFile(importId: $importId, fileId: $fileId) {
    id
  }
}

mutation CheckDataImport($importId: ID!) {
  checkDataImport(importId: $importId) {
    ...DataImportParts
  }
}

mutation RunDataImport($importId: ID!) {
  runDataImport(importId: $importId) {
    ...DataImportParts
  }
}

query DataImport($id: ID!) {
  # @genqlient(pointer: true)
  dataImport(id: $id) {
    ...DataImportParts
  }
}
