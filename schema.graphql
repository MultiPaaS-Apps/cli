"""
Marks a type that decides which rows the server shows the caller: writing one can change any list, so the client discards its whole cache after it.
"""
interface AccessGrant {
"""
Marks a type that decides which rows the server shows the caller: writing one can change any list, so the client discards its whole cache after it.
"""
	_accessGrant: Boolean!
}

