type UserPage {
	items: [User!]!
	pageInfo: PageInfo!
}
type Workflow {
	definition: JSON!
	description: String!
	id: ID!
	key: String!
	name: String!
	runAs: JSON!
	steps: [WorkflowStep!]!
	trigger: JSON!
}
type WorkflowRun {
	appTenant: AppTenant
	attempts: [WorkflowRunAttempt!]!
	createdAt: DateTime!
	finishedAt: DateTime
	id: ID!
	recordsChanged: Int!
	runAs: User
	status: WorkflowRunStatus!
	trigger: JSON!
	triggerKind: String!
}
type WorkflowRunAttempt {
	attempt: Int!
	error: JSON
	failedStepKey: String
	finishedAt: DateTime
	outcome: String!
	startedAt: DateTime!
}
type WorkflowRunPage {
	items: [WorkflowRun!]!
	pageInfo: PageInfo!
}
enum WorkflowRunStatus {
	FAILED
	QUEUED
	RUNNING
	SUCCEEDED
}
type WorkflowStep {
	description: String!
	key: String!
	kind: String!
	name: String!
}
